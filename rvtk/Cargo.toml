[package]
name = "rvtk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe Rust bindings to the Visualization Toolkit (VTK)"

[lib]
# The package is `rvtk` (the crate name `vtk` is taken on crates.io), but the
# library keeps its natural name so downstream code reads `use vtk::...`.
name = "vtk"
# The generated code carries VTK's doxygen comments, which contain C++ code
# blocks rustdoc would otherwise try to run as doctests.
doctest = false

[dependencies]
rvtk-sys.workspace = true

# One feature per wrapped VTK module, forwarded to `rvtk-sys`, where it selects
# the VTK libraries to build and the generated bindings to compile.  The default
# set is the minimum: CommonCore (the object model), CommonDataModel (datasets)
# and FiltersCore (the pipeline filters), plus the modules they require.
[features]
default = ["vtkCommonCore", "vtkCommonDataModel", "vtkFiltersCore"]
vtkCommonColor = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel"]
vtkCommonCore = []
vtkCommonDataModel = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonMath", "rvtk-sys/vtkCommonMisc", "rvtk-sys/vtkCommonSystem", "rvtk-sys/vtkCommonTransforms"]
vtkCommonExecutionModel = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonMisc", "rvtk-sys/vtkCommonSystem"]
vtkCommonMath = ["rvtk-sys/vtkCommonCore"]
vtkCommonMisc = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonMath"]
vtkCommonSystem = ["rvtk-sys/vtkCommonCore"]
vtkCommonTransforms = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonMath"]
vtkFiltersCore = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonExecutionModel", "rvtk-sys/vtkCommonMath", "rvtk-sys/vtkCommonMisc", "rvtk-sys/vtkCommonSystem", "rvtk-sys/vtkCommonTransforms"]
vtkFiltersGeneral = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonExecutionModel", "rvtk-sys/vtkCommonMath", "rvtk-sys/vtkCommonMisc", "rvtk-sys/vtkCommonSystem", "rvtk-sys/vtkCommonTransforms", "rvtk-sys/vtkFiltersCore", "rvtk-sys/vtkFiltersGeometry"]
vtkFiltersGeometry = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonExecutionModel", "rvtk-sys/vtkFiltersCore"]
vtkFiltersSources = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonExecutionModel", "rvtk-sys/vtkCommonTransforms", "rvtk-sys/vtkFiltersCore", "rvtk-sys/vtkFiltersGeneral"]
vtkIOCore = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonExecutionModel", "rvtk-sys/vtkCommonMisc"]
vtkIOGeometry = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonExecutionModel", "rvtk-sys/vtkCommonMisc", "rvtk-sys/vtkCommonSystem", "rvtk-sys/vtkCommonTransforms", "rvtk-sys/vtkFiltersGeneral", "rvtk-sys/vtkIOCore", "rvtk-sys/vtkIOImage", "rvtk-sys/vtkIOLegacy", "rvtk-sys/vtkImagingCore", "rvtk-sys/vtkRenderingCore"]
vtkIOImage = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonExecutionModel", "rvtk-sys/vtkCommonMath", "rvtk-sys/vtkCommonMisc", "rvtk-sys/vtkCommonSystem", "rvtk-sys/vtkCommonTransforms", "rvtk-sys/vtkIOCore", "rvtk-sys/vtkImagingCore"]
vtkIOLegacy = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonExecutionModel", "rvtk-sys/vtkCommonMisc", "rvtk-sys/vtkIOCore"]
vtkIOPLY = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonMisc", "rvtk-sys/vtkIOCore"]
vtkImagingCore = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonExecutionModel", "rvtk-sys/vtkCommonMath", "rvtk-sys/vtkCommonTransforms"]
vtkImagingHybrid = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonExecutionModel", "rvtk-sys/vtkIOImage", "rvtk-sys/vtkImagingCore"]
vtkInteractionStyle = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonMath", "rvtk-sys/vtkCommonSystem", "rvtk-sys/vtkCommonTransforms", "rvtk-sys/vtkFiltersCore", "rvtk-sys/vtkFiltersSources", "rvtk-sys/vtkRenderingCore"]
vtkInteractionWidgets = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonExecutionModel", "rvtk-sys/vtkCommonMath", "rvtk-sys/vtkCommonSystem", "rvtk-sys/vtkCommonTransforms", "rvtk-sys/vtkFiltersCore", "rvtk-sys/vtkFiltersGeneral", "rvtk-sys/vtkFiltersSources", "rvtk-sys/vtkImagingCore", "rvtk-sys/vtkImagingHybrid", "rvtk-sys/vtkInteractionStyle", "rvtk-sys/vtkRenderingAnnotation", "rvtk-sys/vtkRenderingContext2D", "rvtk-sys/vtkRenderingCore", "rvtk-sys/vtkRenderingFreeType", "rvtk-sys/vtkRenderingVolume"]
vtkRenderingAnnotation = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonExecutionModel", "rvtk-sys/vtkCommonMath", "rvtk-sys/vtkCommonTransforms", "rvtk-sys/vtkFiltersCore", "rvtk-sys/vtkFiltersGeneral", "rvtk-sys/vtkFiltersSources", "rvtk-sys/vtkRenderingCore", "rvtk-sys/vtkRenderingFreeType"]
vtkRenderingCellGrid = ["rvtk-sys/vtkCommonColor", "rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonExecutionModel", "rvtk-sys/vtkRenderingCore", "rvtk-sys/vtkRenderingOpenGL2"]
vtkRenderingContext2D = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonExecutionModel", "rvtk-sys/vtkCommonMath", "rvtk-sys/vtkCommonSystem", "rvtk-sys/vtkCommonTransforms", "rvtk-sys/vtkFiltersGeneral", "rvtk-sys/vtkRenderingCore", "rvtk-sys/vtkRenderingFreeType"]
vtkRenderingContextOpenGL2 = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonMath", "rvtk-sys/vtkCommonTransforms", "rvtk-sys/vtkImagingCore", "rvtk-sys/vtkRenderingContext2D", "rvtk-sys/vtkRenderingCore", "rvtk-sys/vtkRenderingFreeType", "rvtk-sys/vtkRenderingOpenGL2"]
vtkRenderingCore = ["rvtk-sys/vtkCommonColor", "rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonExecutionModel", "rvtk-sys/vtkCommonMath", "rvtk-sys/vtkCommonSystem", "rvtk-sys/vtkCommonTransforms", "rvtk-sys/vtkFiltersCore", "rvtk-sys/vtkFiltersGeneral", "rvtk-sys/vtkFiltersGeometry", "rvtk-sys/vtkFiltersSources"]
vtkRenderingFreeType = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonExecutionModel", "rvtk-sys/vtkFiltersGeneral", "rvtk-sys/vtkRenderingCore"]
vtkRenderingHyperTreeGrid = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonExecutionModel", "rvtk-sys/vtkCommonMath", "rvtk-sys/vtkRenderingCore"]
vtkRenderingImage = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonExecutionModel", "rvtk-sys/vtkCommonMath", "rvtk-sys/vtkCommonTransforms", "rvtk-sys/vtkImagingCore", "rvtk-sys/vtkRenderingCore"]
vtkRenderingLOD = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonExecutionModel", "rvtk-sys/vtkCommonMath", "rvtk-sys/vtkCommonSystem", "rvtk-sys/vtkFiltersCore", "rvtk-sys/vtkRenderingCore"]
vtkRenderingLabel = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonExecutionModel", "rvtk-sys/vtkCommonMath", "rvtk-sys/vtkCommonSystem", "rvtk-sys/vtkCommonTransforms", "rvtk-sys/vtkFiltersGeneral", "rvtk-sys/vtkImagingCore", "rvtk-sys/vtkRenderingCore", "rvtk-sys/vtkRenderingFreeType"]
vtkRenderingOpenGL2 = ["rvtk-sys/vtkCommonColor", "rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonExecutionModel", "rvtk-sys/vtkCommonMath", "rvtk-sys/vtkCommonSystem", "rvtk-sys/vtkCommonTransforms", "rvtk-sys/vtkFiltersGeneral", "rvtk-sys/vtkIOCore", "rvtk-sys/vtkIOImage", "rvtk-sys/vtkImagingCore", "rvtk-sys/vtkRenderingCore", "rvtk-sys/vtkRenderingFreeType", "rvtk-sys/vtkRenderingHyperTreeGrid", "rvtk-sys/vtkRenderingLabel", "rvtk-sys/vtkRenderingUI"]
vtkRenderingUI = ["rvtk-sys/vtkRenderingCore"]
vtkRenderingVolume = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonExecutionModel", "rvtk-sys/vtkCommonMath", "rvtk-sys/vtkCommonMisc", "rvtk-sys/vtkCommonSystem", "rvtk-sys/vtkCommonTransforms", "rvtk-sys/vtkImagingCore", "rvtk-sys/vtkRenderingCore"]
vtkRenderingVolumeOpenGL2 = ["rvtk-sys/vtkCommonCore", "rvtk-sys/vtkCommonDataModel", "rvtk-sys/vtkCommonMath", "rvtk-sys/vtkCommonSystem", "rvtk-sys/vtkCommonTransforms", "rvtk-sys/vtkFiltersCore", "rvtk-sys/vtkFiltersGeneral", "rvtk-sys/vtkFiltersSources", "rvtk-sys/vtkImagingCore", "rvtk-sys/vtkRenderingCore", "rvtk-sys/vtkRenderingOpenGL2", "rvtk-sys/vtkRenderingVolume"]

# Examples and tests that use modules outside the default feature set are only
# built when those features are on, so `cargo build`/`cargo test` stay small.
[[example]]
name = "sphere_source"
required-features = ["vtkFiltersSources"]

[[example]]
name = "inspect"
required-features = ["vtkIOCore"]

[[example]]
name = "diag"
required-features = ["vtkFiltersSources", "vtkRenderingCore"]

# Derived from the generated `rvtk-gen/tests/smoke.rs`.

# The smoke test is generated with one `#[cfg(feature = "...")]` per check, so
# it compiles against whatever modules are enabled.
[[test]]
name = "smoke"
harness = false

[[test]]
name = "pipeline"
required-features = ["vtkFiltersSources"]

# The rendering test drives VTK's OpenGL backend directly.  On macOS that
# creates an `NSWindow` (VTK's Cocoa backend does so even when offscreen
# rendering is on), and AppKit requires window creation on the *main* thread,
# while the built-in libtest harness runs every test on a worker thread.
# The smoke and rendering tests therefore run through their own `main`, which
# keeps them on the main thread and makes a crash identify its class.
[[test]]
name = "rendering"
harness = false
required-features = ["vtkRenderingOpenGL2"]
