[package]
name = "rvtk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe Rust bindings to the Visualization Toolkit (VTK)"

[lib]
# The package is `rvtk` (the crate name `vtk` is taken on crates.io), but the
# library keeps its natural name so downstream code reads `use vtk::...`.
name = "vtk"
# The generated code carries VTK's doxygen comments, which contain C++ code
# blocks rustdoc would otherwise try to run as doctests.
doctest = false

[dependencies]
rvtk-sys.workspace = true

# Derived from the generated `rvtk-gen/tests/smoke.rs`.

# The rendering test drives VTK's OpenGL backend directly.  On macOS that
# creates an `NSWindow` (VTK's Cocoa backend does so even when offscreen
# rendering is on), and AppKit requires window creation on the *main* thread,
# while the built-in libtest harness runs every test on a worker thread.
# The smoke and rendering tests therefore run through their own `main`, which
# keeps them on the main thread and makes a crash identify its class.
[[test]]
name = "smoke"
harness = false

[[test]]
name = "rendering"
harness = false
