[package]
name = "rvtk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe Rust bindings to the Visualization Toolkit (VTK)"

[lib]
# The package is `rvtk` (the crate name `vtk` is taken on crates.io), but the
# library keeps its natural name so downstream code reads `use vtk::...`.
name = "vtk"
# The generated code carries VTK's doxygen comments, which contain C++ code
# blocks rustdoc would otherwise try to run as doctests.
doctest = false

[dependencies]
rvtk-sys.workspace = true

# One feature per wrapped VTK module, forwarded to `rvtk-sys`, where it selects
# the VTK libraries to build and the generated bindings to compile.  The default
# set is the minimum: CommonCore (the object model), CommonDataModel (datasets)
# and FiltersCore (the pipeline filters), plus the modules they require.
[features]
default = ["vtkCommonCore", "vtkCommonDataModel", "vtkFiltersCore"]
vtkCommonColor = ["rvtk-sys/vtkCommonColor", "vtkCommonCore", "vtkCommonDataModel"]
vtkCommonCore = ["rvtk-sys/vtkCommonCore"]
vtkCommonDataModel = ["rvtk-sys/vtkCommonDataModel", "vtkCommonCore", "vtkCommonMath", "vtkCommonMisc", "vtkCommonSystem", "vtkCommonTransforms"]
vtkCommonExecutionModel = ["rvtk-sys/vtkCommonExecutionModel", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonMisc", "vtkCommonSystem"]
vtkCommonMath = ["rvtk-sys/vtkCommonMath", "vtkCommonCore"]
vtkCommonMisc = ["rvtk-sys/vtkCommonMisc", "vtkCommonCore", "vtkCommonMath"]
vtkCommonSystem = ["rvtk-sys/vtkCommonSystem", "vtkCommonCore"]
vtkCommonTransforms = ["rvtk-sys/vtkCommonTransforms", "vtkCommonCore", "vtkCommonMath"]
vtkFiltersCore = ["rvtk-sys/vtkFiltersCore", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonMisc", "vtkCommonSystem", "vtkCommonTransforms"]
vtkFiltersGeneral = ["rvtk-sys/vtkFiltersGeneral", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonMisc", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersCore", "vtkFiltersGeometry"]
vtkFiltersGeometry = ["rvtk-sys/vtkFiltersGeometry", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkFiltersCore"]
vtkFiltersSources = ["rvtk-sys/vtkFiltersSources", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonTransforms", "vtkFiltersCore", "vtkFiltersGeneral"]
vtkIOCore = ["rvtk-sys/vtkIOCore", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMisc"]
vtkIOGeometry = ["rvtk-sys/vtkIOGeometry", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMisc", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersGeneral", "vtkIOCore", "vtkIOImage", "vtkIOLegacy", "vtkImagingCore", "vtkRenderingCore"]
vtkIOImage = ["rvtk-sys/vtkIOImage", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonMisc", "vtkCommonSystem", "vtkCommonTransforms", "vtkIOCore", "vtkImagingCore"]
vtkIOLegacy = ["rvtk-sys/vtkIOLegacy", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMisc", "vtkIOCore"]
vtkIOPLY = ["rvtk-sys/vtkIOPLY", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonMisc", "vtkIOCore"]
vtkImagingCore = ["rvtk-sys/vtkImagingCore", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonTransforms"]
vtkImagingHybrid = ["rvtk-sys/vtkImagingHybrid", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkIOImage", "vtkImagingCore"]
vtkInteractionStyle = ["rvtk-sys/vtkInteractionStyle", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonMath", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersCore", "vtkFiltersSources", "vtkRenderingCore"]
vtkInteractionWidgets = ["rvtk-sys/vtkInteractionWidgets", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersCore", "vtkFiltersGeneral", "vtkFiltersSources", "vtkImagingCore", "vtkImagingHybrid", "vtkInteractionStyle", "vtkRenderingAnnotation", "vtkRenderingContext2D", "vtkRenderingCore", "vtkRenderingFreeType", "vtkRenderingVolume"]
vtkRenderingAnnotation = ["rvtk-sys/vtkRenderingAnnotation", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonTransforms", "vtkFiltersCore", "vtkFiltersGeneral", "vtkFiltersSources", "vtkRenderingCore", "vtkRenderingFreeType"]
vtkRenderingCellGrid = ["rvtk-sys/vtkRenderingCellGrid", "vtkCommonColor", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkRenderingCore", "vtkRenderingOpenGL2"]
vtkRenderingContext2D = ["rvtk-sys/vtkRenderingContext2D", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersGeneral", "vtkRenderingCore", "vtkRenderingFreeType"]
vtkRenderingContextOpenGL2 = ["rvtk-sys/vtkRenderingContextOpenGL2", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonMath", "vtkCommonTransforms", "vtkImagingCore", "vtkRenderingContext2D", "vtkRenderingCore", "vtkRenderingFreeType", "vtkRenderingOpenGL2"]
vtkRenderingCore = ["rvtk-sys/vtkRenderingCore", "vtkCommonColor", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersCore", "vtkFiltersGeneral", "vtkFiltersGeometry", "vtkFiltersSources"]
vtkRenderingFreeType = ["rvtk-sys/vtkRenderingFreeType", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkFiltersGeneral", "vtkRenderingCore"]
vtkRenderingHyperTreeGrid = ["rvtk-sys/vtkRenderingHyperTreeGrid", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkRenderingCore"]
vtkRenderingImage = ["rvtk-sys/vtkRenderingImage", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonTransforms", "vtkImagingCore", "vtkRenderingCore"]
vtkRenderingLOD = ["rvtk-sys/vtkRenderingLOD", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonSystem", "vtkFiltersCore", "vtkRenderingCore"]
vtkRenderingLabel = ["rvtk-sys/vtkRenderingLabel", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersGeneral", "vtkImagingCore", "vtkRenderingCore", "vtkRenderingFreeType"]
vtkRenderingOpenGL2 = ["rvtk-sys/vtkRenderingOpenGL2", "vtkCommonColor", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersGeneral", "vtkIOCore", "vtkIOImage", "vtkImagingCore", "vtkRenderingCore", "vtkRenderingFreeType", "vtkRenderingHyperTreeGrid", "vtkRenderingLabel", "vtkRenderingUI"]
vtkRenderingUI = ["rvtk-sys/vtkRenderingUI", "vtkRenderingCore"]
vtkRenderingVolume = ["rvtk-sys/vtkRenderingVolume", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonMisc", "vtkCommonSystem", "vtkCommonTransforms", "vtkImagingCore", "vtkRenderingCore"]
vtkRenderingVolumeOpenGL2 = ["rvtk-sys/vtkRenderingVolumeOpenGL2", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonMath", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersCore", "vtkFiltersGeneral", "vtkFiltersSources", "vtkImagingCore", "vtkRenderingCore", "vtkRenderingOpenGL2", "vtkRenderingVolume"]

# Examples and tests that use modules outside the default feature set are only
# built when those features are on, so `cargo build`/`cargo test` stay small.
[[example]]
name = "sphere_source"
required-features = ["vtkFiltersSources"]

[[example]]
name = "inspect"
required-features = ["vtkIOCore"]

[[example]]
name = "diag"
required-features = ["vtkFiltersSources", "vtkRenderingCore"]

# Derived from the generated `rvtk-gen/tests/smoke.rs`.

# The smoke test is generated with one `#[cfg(feature = "...")]` per check, so
# it compiles against whatever modules are enabled.
[[test]]
name = "smoke"
harness = false

[[test]]
name = "pipeline"
required-features = ["vtkFiltersSources"]

# The rendering test drives VTK's OpenGL backend directly.  On macOS that
# creates an `NSWindow` (VTK's Cocoa backend does so even when offscreen
# rendering is on), and AppKit requires window creation on the *main* thread,
# while the built-in libtest harness runs every test on a worker thread.
# The smoke and rendering tests therefore run through their own `main`, which
# keeps them on the main thread and makes a crash identify its class.
[[test]]
name = "rendering"
harness = false
required-features = ["vtkRenderingOpenGL2"]
