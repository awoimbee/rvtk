[package]
name = "vtk-wrap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe Rust bindings to the Visualization Toolkit (VTK)"

[lib]
name = "vtk_wrap"
# The generated code carries VTK's doxygen comments, which contain C++ code
# blocks rustdoc would otherwise try to run as doctests.
doctest = false

[dependencies]
vtk-wrap-sys.workspace = true

# One feature per wrapped VTK module, forwarded to `vtk-wrap-sys`, where it selects
# the VTK libraries to build and the generated bindings to compile.  The default
# set is the minimum: CommonCore (the object model), CommonDataModel (datasets)
# and FiltersCore (the pipeline filters), plus the modules they require.
[features]
default = ["vtkCommonCore", "vtkCommonDataModel", "vtkFiltersCore"]
vtkCommonColor = ["vtk-wrap-sys/vtkCommonColor", "vtkCommonCore", "vtkCommonDataModel"]
vtkCommonCore = ["vtk-wrap-sys/vtkCommonCore"]
vtkCommonDataModel = ["vtk-wrap-sys/vtkCommonDataModel", "vtkCommonCore", "vtkCommonMath", "vtkCommonMisc", "vtkCommonSystem", "vtkCommonTransforms"]
vtkCommonExecutionModel = ["vtk-wrap-sys/vtkCommonExecutionModel", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonMisc", "vtkCommonSystem"]
vtkCommonMath = ["vtk-wrap-sys/vtkCommonMath", "vtkCommonCore"]
vtkCommonMisc = ["vtk-wrap-sys/vtkCommonMisc", "vtkCommonCore", "vtkCommonMath"]
vtkCommonSystem = ["vtk-wrap-sys/vtkCommonSystem", "vtkCommonCore"]
vtkCommonTransforms = ["vtk-wrap-sys/vtkCommonTransforms", "vtkCommonCore", "vtkCommonMath"]
vtkFiltersCore = ["vtk-wrap-sys/vtkFiltersCore", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonMisc", "vtkCommonSystem", "vtkCommonTransforms"]
vtkFiltersGeneral = ["vtk-wrap-sys/vtkFiltersGeneral", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonMisc", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersCore", "vtkFiltersGeometry"]
vtkFiltersGeometry = ["vtk-wrap-sys/vtkFiltersGeometry", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkFiltersCore"]
vtkFiltersSources = ["vtk-wrap-sys/vtkFiltersSources", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonTransforms", "vtkFiltersCore", "vtkFiltersGeneral"]
vtkIOCore = ["vtk-wrap-sys/vtkIOCore", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMisc"]
vtkIOGeometry = ["vtk-wrap-sys/vtkIOGeometry", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMisc", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersGeneral", "vtkIOCore", "vtkIOImage", "vtkIOLegacy", "vtkImagingCore", "vtkRenderingCore"]
vtkIOImage = ["vtk-wrap-sys/vtkIOImage", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonMisc", "vtkCommonSystem", "vtkCommonTransforms", "vtkIOCore", "vtkImagingCore"]
vtkIOLegacy = ["vtk-wrap-sys/vtkIOLegacy", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMisc", "vtkIOCore"]
vtkIOPLY = ["vtk-wrap-sys/vtkIOPLY", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonMisc", "vtkIOCore"]
vtkImagingCore = ["vtk-wrap-sys/vtkImagingCore", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonTransforms"]
vtkImagingHybrid = ["vtk-wrap-sys/vtkImagingHybrid", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkIOImage", "vtkImagingCore"]
vtkInteractionStyle = ["vtk-wrap-sys/vtkInteractionStyle", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonMath", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersCore", "vtkFiltersSources", "vtkRenderingCore"]
vtkInteractionWidgets = ["vtk-wrap-sys/vtkInteractionWidgets", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersCore", "vtkFiltersGeneral", "vtkFiltersSources", "vtkImagingCore", "vtkImagingHybrid", "vtkInteractionStyle", "vtkRenderingAnnotation", "vtkRenderingContext2D", "vtkRenderingCore", "vtkRenderingFreeType", "vtkRenderingVolume"]
vtkRenderingAnnotation = ["vtk-wrap-sys/vtkRenderingAnnotation", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonTransforms", "vtkFiltersCore", "vtkFiltersGeneral", "vtkFiltersSources", "vtkRenderingCore", "vtkRenderingFreeType"]
vtkRenderingCellGrid = ["vtk-wrap-sys/vtkRenderingCellGrid", "vtkCommonColor", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkRenderingCore", "vtkRenderingOpenGL2"]
vtkRenderingContext2D = ["vtk-wrap-sys/vtkRenderingContext2D", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersGeneral", "vtkRenderingCore", "vtkRenderingFreeType"]
vtkRenderingContextOpenGL2 = ["vtk-wrap-sys/vtkRenderingContextOpenGL2", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonMath", "vtkCommonTransforms", "vtkImagingCore", "vtkRenderingContext2D", "vtkRenderingCore", "vtkRenderingFreeType", "vtkRenderingOpenGL2"]
vtkRenderingCore = ["vtk-wrap-sys/vtkRenderingCore", "vtkCommonColor", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersCore", "vtkFiltersGeneral", "vtkFiltersGeometry", "vtkFiltersSources"]
vtkRenderingFreeType = ["vtk-wrap-sys/vtkRenderingFreeType", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkFiltersGeneral", "vtkRenderingCore"]
vtkRenderingHyperTreeGrid = ["vtk-wrap-sys/vtkRenderingHyperTreeGrid", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkRenderingCore"]
vtkRenderingImage = ["vtk-wrap-sys/vtkRenderingImage", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonTransforms", "vtkImagingCore", "vtkRenderingCore"]
vtkRenderingLOD = ["vtk-wrap-sys/vtkRenderingLOD", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonSystem", "vtkFiltersCore", "vtkRenderingCore"]
vtkRenderingLabel = ["vtk-wrap-sys/vtkRenderingLabel", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersGeneral", "vtkImagingCore", "vtkRenderingCore", "vtkRenderingFreeType"]
vtkRenderingOpenGL2 = ["vtk-wrap-sys/vtkRenderingOpenGL2", "vtkCommonColor", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersGeneral", "vtkIOCore", "vtkIOImage", "vtkImagingCore", "vtkRenderingCore", "vtkRenderingFreeType", "vtkRenderingHyperTreeGrid", "vtkRenderingLabel", "vtkRenderingUI"]
vtkRenderingUI = ["vtk-wrap-sys/vtkRenderingUI", "vtkRenderingCore"]
vtkRenderingVolume = ["vtk-wrap-sys/vtkRenderingVolume", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonMisc", "vtkCommonSystem", "vtkCommonTransforms", "vtkImagingCore", "vtkRenderingCore"]
vtkRenderingVolumeOpenGL2 = ["vtk-wrap-sys/vtkRenderingVolumeOpenGL2", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonMath", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersCore", "vtkFiltersGeneral", "vtkFiltersSources", "vtkImagingCore", "vtkRenderingCore", "vtkRenderingOpenGL2", "vtkRenderingVolume"]

# Examples and tests that use modules outside the default feature set are only
# built when those features are on, so `cargo build`/`cargo test` stay small.
[[example]]
name = "sphere_source"
required-features = ["vtkFiltersSources"]

[[example]]
name = "inspect"
required-features = ["vtkIOCore"]

[[example]]
name = "diag"
required-features = ["vtkFiltersSources", "vtkRenderingCore"]

# Derived from the generated `vtk-wrap-gen/tests/smoke.rs`.

# The smoke test is generated with one `#[cfg(feature = "...")]` per check, so
# it compiles against whatever modules are enabled.
[[test]]
name = "smoke"
harness = false

[[test]]
name = "pipeline"
required-features = ["vtkFiltersSources"]

# The rendering test drives VTK's OpenGL backend directly.  On macOS that
# creates an `NSWindow` (VTK's Cocoa backend does so even when offscreen
# rendering is on), and AppKit requires window creation on the *main* thread,
# while the built-in libtest harness runs every test on a worker thread.
# The smoke and rendering tests therefore run through their own `main`, which
# keeps them on the main thread and makes a crash identify its class.
[[test]]
name = "rendering"
harness = false
required-features = ["vtkRenderingOpenGL2"]
