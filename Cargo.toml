[workspace]
resolver = "2"
members = [
    "rvtk-gen",
    "rvtk-sys",
    "rvtk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/awoimbee/rvtk"
authors = ["rvtk contributors"]

[workspace.dependencies]
# `rvtk-sys` is an implementation detail of `rvtk`; pin it exactly so the two
# always travel together while the ABI is unstable.
rvtk-sys = { path = "rvtk-sys", version = "=0.1.0" }

[profile.dev]
debug = 1
