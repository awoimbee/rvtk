[workspace]
resolver = "2"
members = [
    "vtk-wrap-gen",
    "vtk-wrap-sys",
    "vtk-wrap",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/awoimbee/vtk-wrap"
authors = ["vtk-wrap contributors"]

[workspace.dependencies]
# `vtk-wrap-sys` is an implementation detail of `vtk-wrap`; pin it exactly so the two
# always travel together while the ABI is unstable.
vtk-wrap-sys = { path = "vtk-wrap-sys", version = "=0.1.0" }

[profile.dev]
debug = 1
